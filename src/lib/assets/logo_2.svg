<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <style>
      .compass-outer { fill: none; stroke: #f0a524; stroke-width: 5; }
      .compass-inner { fill: #1f3152; stroke: #f0a524; stroke-width: 1.5; }
      .compass-ring { fill: none; stroke: #ffffff; stroke-width: 1; stroke-dasharray: 2, 4; }
      .compass-ring-solid { fill: none; stroke: #ffffff; stroke-width: 0.75; opacity: 0.5; }
      .pointer-main-n { fill: #f0a524; }
      .pointer-main-s { fill: #c78311; }
      .pointer-sub-n { fill: #7c5412; }
      .pointer-sub-s { fill: #52370b; }
      .text-nav { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; fill: #1f3152; font-weight: bold; text-anchor: middle; }
      .text-main { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 64px; fill: #1f3152; font-weight: 400; letter-spacing: 4px; }
      .text-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; fill: #c78311; font-weight: 400; letter-spacing: 12px; }
      .text-desc { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; fill: #000000; font-weight: 500; letter-spacing: 5px; }
      .line-divider { stroke: #d9c39e; stroke-width: 1.5; }
      .line-underline { stroke: #c78311; stroke-width: 2; }
    </style>
  </defs>

  <g transform="translate(50, 0)">
    <g id="compass" transform="translate(150, 200)">
      <circle r="115" class="compass-outer" />
      <circle r="82" class="compass-inner" />
      <circle r="74" class="compass-ring" />
      <circle r="70" class="compass-ring-solid" />
      <circle r="50" class="compass-ring-solid" />
      
      <g transform="rotate(0)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" /></g>
      <g transform="rotate(15)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(30)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(45)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" opacity="0.7" /></g>
      <g transform="rotate(60)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(75)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(90)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" /></g>
      <g transform="rotate(105)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(120)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(135)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" opacity="0.7" /></g>
      <g transform="rotate(150)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(165)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(180)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" /></g>
      <g transform="rotate(195)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(210)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(225)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" opacity="0.7" /></g>
      <g transform="rotate(240)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(255)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(270)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" /></g>
      <g transform="rotate(285)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(300)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(315)"><line x1="0" y1="-82" x2="0" y2="-76" stroke="#ffffff" stroke-width="1.5" opacity="0.7" /></g>
      <g transform="rotate(330)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>
      <g transform="rotate(345)"><line x1="0" y1="-82" x2="0" y2="-79" stroke="#ffffff" stroke-width="0.75" opacity="0.7" /></g>

      <text x="0" y="-93" class="text-nav">N</text>
      <text x="96" y="7" class="text-nav">E</text>
      <text x="0" y="108" class="text-nav">S</text>
      <text x="-98" y="7" class="text-nav">W</text>

      <g transform="rotate(45)"><polygon points="0,0 -8,-35 0,-45" class="pointer-sub-n" /><polygon points="0,0 8,-35 0,-45" class="pointer-sub-s" /></g>
      <g transform="rotate(135)"><polygon points="0,0 -8,-35 0,-45" class="pointer-sub-n" /><polygon points="0,0 8,-35 0,-45" class="pointer-sub-s" /></g>
      <g transform="rotate(225)"><polygon points="0,0 -8,-35 0,-45" class="pointer-sub-n" /><polygon points="0,0 8,-35 0,-45" class="pointer-sub-s" /></g>
      <g transform="rotate(315)"><polygon points="0,0 -8,-35 0,-45" class="pointer-sub-n" /><polygon points="0,0 8,-35 0,-45" class="pointer-sub-s" /></g>

      <polygon points="0,0 -14,-50 0,-68" class="pointer-main-n" />
      <polygon points="0,0 14,-50 0,-68" class="pointer-main-s" />
      <polygon points="0,0 50,-14 68,0" class="pointer-main-s" />
      <polygon points="0,0 50,14 68,0" class="pointer-main-n" />
      <polygon points="0,0 14,50 0,68" class="pointer-main-n" />
      <polygon points="0,0 -14,50 0,68" class="pointer-main-s" />
      <polygon points="0,0 -50,14 -68,0" class="pointer-main-s" />
      <polygon points="0,0 -50,-14 -68,0" class="pointer-main-n" />

      <circle r="12" fill="#1f3152" stroke="#f0a524" stroke-width="2" />
      <circle r="6" fill="#f0a524" />
      <circle r="2" fill="#1f3152" />
    </g>

    <line x1="285" y1="135" x2="285" y2="265" class="line-divider" />

    <g transform="translate(310, 0)">
      <text x="0" y="222" class="text-main">PARSEN</text>
      
      <line x1="0" y1="234" x2="245" y2="234" class="line-underline" />
      
      <text x="2" y="258" class="text-sub">SOLUTIONS</text>
      
      <text x="4" y="278" class="text-desc">EMBEDDED SYSTEMS &amp; AUTOMATION</text>
    </g>
  </g>
</svg>
