<svg width="100%" viewBox="0 0 720 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Parsen Solutions Logo — Compass Edition</title>
  <desc>Elegant logo for Parsen Solutions with a dark navy compass face matched to the typography, framed by a bold golden outer ring</desc>

  <defs>
    <style>
      .ln { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; font-size: 44px; fill: #1a2744; letter-spacing: 3px; }
      .ls { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #BA7517; letter-spacing: 7px; }
      .lm { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 300; font-size: 11px; fill: #888780; letter-spacing: 2px; }
      @media (prefers-color-scheme: dark) {
        .ln { fill: #E6F1FB; }
        .ls { fill: #FAC775; }
        .lm { fill: #B4B2A9; }
      }
    </style>
  </defs>

  <!-- Compass Graphic Group -->
  <g transform="translate(155,160)">
    <!-- EXPANDED BOLD GOLD OUTER RING -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#EF9F27" stroke-width="3.5" opacity="0.9"/>
    
    <circle cx="0" cy="0" r="58" fill="none" stroke="#BA7517" stroke-width="0.8" opacity="0.4"/>
    
    <!-- BRAND MATCHED NAVY COMPASS FACE BACKGROUND -->
    <circle cx="0" cy="0" r="55" fill="#1a2744"/>
    <circle cx="0" cy="0" r="55" fill="#ffffff" opacity="0.05"/> <!-- Subtle clean overlay reflection -->
    
    <circle cx="0" cy="0" r="46" fill="none" stroke="#EF9F27" stroke-width="0.6" opacity="0.35"/>

    <!-- Cardinal ticks -->
    <line x1="0" y1="-58" x2="0" y2="-50" stroke="#EF9F27" stroke-width="1.2" opacity="0.75"/>
    <line x1="0" y1="50"  x2="0" y2="58"  stroke="#EF9F27" stroke-width="1.2" opacity="0.75"/>
    <line x1="-58" y1="0" x2="-50" y2="0" stroke="#EF9F27" stroke-width="1.2" opacity="0.75"/>
    <line x1="50"  y1="0" x2="58"  y2="0" stroke="#EF9F27" stroke-width="1.2" opacity="0.75"/>

    <!-- Intercardinal ticks (45, 135, 225, 315 deg) -->
    <line x1="41"  y1="-41" x2="36"  y2="-36" stroke="#EF9F27" stroke-width="1.0" opacity="0.5"/>
    <line x1="-41" y1="-41" x2="-36"  y2="-36" stroke="#EF9F27" stroke-width="1.0" opacity="0.5"/>
    <line x1="41"  y1="41"  x2="36"  y2="36"  stroke="#EF9F27" stroke-width="1.0" opacity="0.5"/>
    <line x1="-41" y1="41"  x2="-36"  y2="36"  stroke="#EF9F27" stroke-width="1.0" opacity="0.5"/>

    <!-- COMPASS SCALE SUB-TICKS -->
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(15)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(30)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(60)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(75)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(105)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(120)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(150)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(165)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(195)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(210)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(240)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(255)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(285)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(300)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(330)" />
    <line x1="0" y1="-55" x2="0" y2="-50" stroke="#EF9F27" stroke-width="0.6" opacity="0.4" transform="rotate(345)" />

    <!-- N, S, E, W DIRECTION LABELS -->
    <text x="0" y="-66" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744" opacity="0.95">N</text>
    <text x="0" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744" opacity="0.95">S</text>
    <text x="69" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744" opacity="0.95">E</text>
    <text x="-69" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744" opacity="0.95">W</text>

    <!-- North point (gold) -->
    <polygon points="0,-42  -9,-6   0,-14  9,-6" fill="#EF9F27"/>
    <!-- South point -->
    <polygon points="0,42   9,6    0,14  -9,6"  fill="#BA7517"/>
    <!-- East point -->
    <polygon points="42,0   6,-9   14,0   6,9"  fill="#EF9F27"/>
    <!-- West point -->
    <polygon points="-42,0 -6,9  -14,0  -6,-9"  fill="#BA7517"/>

    <!-- Secondary diagonal points -->
    <polygon points="0,-42  -5,-28  0,-32  5,-28"  fill="#EF9F27" opacity="0.4" transform="rotate(45)"/>
    <polygon points="0,-42  -5,-28  0,-32  5,-28"  fill="#EF9F27" opacity="0.4" transform="rotate(135)"/>
    <polygon points="0,-42  -5,-28  0,-32  5,-28"  fill="#EF9F27" opacity="0.4" transform="rotate(225)"/>
    <polygon points="0,-42  -5,-28  0,-32  5,-28"  fill="#EF9F27" opacity="0.4" transform="rotate(315)"/>

    <!-- Center pivot -->
    <circle cx="0" cy="0" r="5" fill="#EF9F27"/>
    <circle cx="0" cy="0" r="2.5" fill="#1a2744"/>
  </g>

  <!-- Vertical divider -->
  <line x1="252" y1="110" x2="252" y2="210" stroke="#BA7517" stroke-width="1" opacity="0.5"/>

  <!-- Company name components -->
  <text x="274" y="178" class="ln">PARSEN</text>
  <rect x="274" y="185" width="200" height="1.5" rx="0.75" fill="#BA7517" opacity="0.6"/>
  <text x="276" y="205" class="ls">SOLUTIONS</text>
  <text x="277" y="222" class="lm">EMBEDDED SYSTEMS &amp; AUTOMATION</text>

</svg>
